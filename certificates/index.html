<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>获奖证书 · 陶存心</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e; --link:#58a6ff; --gold:#e3b341; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); line-height:1.65; font-size:15px; }
  .wrap { max-width:1000px; margin:0 auto; padding:48px 20px 70px; }
  .topnav { font-size:13px; color:var(--muted); margin-bottom:26px; }
  .topnav a { color:var(--link); text-decoration:none; }
  header h1 { font-size:28px; font-weight:600; }
  header .sub { color:var(--muted); margin-top:10px; font-size:14.5px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:20px; margin-top:34px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; overflow:hidden; display:block; text-decoration:none; color:inherit; transition:border-color .15s, transform .15s; }
  .card:hover { border-color:#8b949e; transform:translateY(-3px); }
  .card img { width:100%; display:block; background:#000; border-bottom:1px solid var(--border); }
  .card .body { padding:16px 18px 18px; }
  .card .title { font-size:16px; font-weight:600; margin-bottom:6px; }
  .card .meta { font-size:13px; color:var(--muted); }
  .card .go { color:var(--link); font-size:13px; margin-top:10px; }
  footer { text-align:center; margin-top:52px; color:#6b7590; font-size:13px; line-height:2; }
  footer a { color:var(--link); text-decoration:none; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="topnav"><a href="https://cunxintao-hub.github.io/">← 返回个人主页</a></div>

    </header>

    <div class="grid">

      <a class="card" href="./certs/740427.png" target="_blank">

      <a class="card" href="./certs/kid-morph.pdf" target="_blank">

      <a class="card" href="./certs/hi-box.pdf" target="_blank">

      <a class="card" href="./certs/medical-robot.pdf" target="_blank">

          <div class="meta">设计竞赛获奖作品</div>
          <div class="go">查看证书 PDF →</div>

    </div>

    <footer>
      <p>© 2026 陶存心</p>
      <p><a href="https://cunxintao-hub.github.io/">个人主页</a> · <a href="https://github.com/cunxintao-hub">GitHub</a></p>
    </footer>
  </div>
</body>
</html>
